name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site/assets/img _site/assets/css _site/assets/js
          # HTML pages (landing hub + 5 mode pages)
          cp -v index.html spin.html number.html range.html roller.html duck.html trick.html _site/ 2>/dev/null || true
          # Static assets
          cp -v assets/img/*.png assets/img/*.jpg assets/img/*.svg _site/assets/img/ 2>/dev/null || true
          cp -v assets/css/*.css _site/assets/css/ 2>/dev/null || true
          cp -v assets/js/*.js _site/assets/js/ 2>/dev/null || true
          # Root-level SEO / verification files
          cp -v CNAME robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -v google*.html _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
