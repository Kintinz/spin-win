name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build encoded index (preserve full SEO <head>)
        shell: pwsh
        run: ./build-encoded.ps1

      - name: Prepare site directory
        run: |
          mkdir -p _site
          # deploy encoded version as index.html
          cp index-encoded.html _site/index.html
          # copy all static assets
          cp -v CNAME robots.txt sitemap.xml *.png *.jpg *.svg _site/ 2>/dev/null || true
          cp -v google*.html _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
