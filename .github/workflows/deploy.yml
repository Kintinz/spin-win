name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site/assets/img _site/assets/css _site/assets/js _site/assets/mp3
          # Landing hub + trick page + legacy .html redirects (spin.html, etc → /spin/)
          cp -v index.html trick.html spin.html number.html range.html roller.html duck.html _site/ 2>/dev/null || true
          # Per-mode pages served at clean URLs: /spin/, /number/, /range/, /roller/, /duck/
          for m in spin number range roller duck; do
            mkdir -p "_site/$m"
            cp -v "$m/index.html" "_site/$m/index.html"
          done
          # English mirror: /en/ hub + /en/<mode>/ for every mode page.
          mkdir -p _site/en
          cp -v en/index.html _site/en/index.html
          for m in spin number range roller duck; do
            mkdir -p "_site/en/$m"
            cp -v "en/$m/index.html" "_site/en/$m/index.html"
          done
          # Static assets
          cp -v assets/img/*.png assets/img/*.jpg assets/img/*.svg _site/assets/img/ 2>/dev/null || true
          cp -v assets/css/*.css _site/assets/css/ 2>/dev/null || true
          cp -v assets/js/*.js _site/assets/js/ 2>/dev/null || true
          cp -v assets/mp3/*.mp3 _site/assets/mp3/ 2>/dev/null || true
          # Root-level SEO / verification files
          cp -v CNAME robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -v google*.html _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
